name: Build Avi Jet Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Avi_Jet_Analyzer_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f Avi_Jet_Analyzer_Android_Project.zip
          mkdir android-project
          unzip Avi_Jet_Analyzer_Android_Project.zip -d android-project
          find android-project -name settings.gradle -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -print -quit)")
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Avi-Jet-Analyzer-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
